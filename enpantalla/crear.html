<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Armá tu pantalla · enpantalla</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2937;--mut:#6b7280;--pri:#2563eb;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
header a{color:var(--tx);text-decoration:none;font-weight:800}
.wrap{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;padding:20px;max-width:1400px;margin:auto}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps b{flex:1;height:6px;border-radius:9px;background:var(--bd)}.steps b.on{background:var(--pri)}
h2{margin:0 0 12px;font-size:20px}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--bd);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:var(--bg);font:inherit;color:var(--tx)}
.opt.on{border-color:var(--pri)}.opt span{font-size:28px;display:block}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw button.on{border-color:var(--tx)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.sl{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.sl .top{display:flex;gap:6px;align-items:center;justify-content:space-between}
.sl small{color:var(--mut)}.mini{padding:4px 9px;border-radius:7px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
#pv{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
#pv.v{aspect-ratio:9/16;max-width:360px;margin:auto}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut)}
.sticky{position:sticky;top:12px;align-self:start}
</style>
</head>
<body>
<header><a href="./">📺 en<span style="color:var(--pri)">pantalla</span></a><a href="https://wa.me/5492233485788" style="font-weight:500">¿Ayuda? WhatsApp</a></header>
<div class="wrap">
  <div class="card">
    <div class="steps" id="steps"><b></b><b></b><b></b><b></b></div>
    <div id="panel"></div>
  </div>
  <div class="sticky">
    <div class="card"><div id="pv"></div><div class="dots" id="dots"></div></div>
  </div>
</div>
<script src="ep.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'enpantalla.v1', paso = 0, player = null, idx = 0;
  var cfg = null;

  function estadoDe(rubro) {
    var r = EP.porId(EP.RUBROS, rubro);
    return {
      rubro: r.id, nombre: '', pie: '', whatsapp: '', logo: '', orientacion: 'h', paleta: r.paleta, fuente: r.fuente,
      slides: r.slides.map(function (s) { return Object.assign({ img: '', video: '', segundos: 8 }, s); })
    };
  }
  function guardar() {
    try { localStorage.setItem(KEY, JSON.stringify(cfg, function (k, v) { return k === 'video' && /^blob:/.test(v) ? '' : v; })); } catch (e) {}
  }
  function cargar() {
    var q = new URLSearchParams(location.search).get('rubro');
    if (q) return estadoDe(q);
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.slides) return s; } catch (e) {}
    return null;
  }
  // El reproductor recibe paleta y fuente ya resueltas (así viaja autocontenido en el HTML).
  function paraPlayer() {
    return Object.assign({}, cfg, { p: EP.porId(EP.PALETAS, cfg.paleta), f: EP.porId(EP.FUENTES, cfg.fuente), nombre: cfg.nombre || 'Tu negocio' });
  }
  function dibujar() {
    if (player) player.parar();
    $('pv').className = cfg.orientacion === 'v' ? 'v' : '';
    idx = Math.min(idx, cfg.slides.length - 1);
    player = EP.player(paraPlayer(), $('pv'), { fija: true, indice: Math.max(idx, 0) });
    $('dots').innerHTML = cfg.slides.map(function (s, i) {
      return '<button class="mini" data-i="' + i + '">' + (i + 1) + '</button>';
    }).join('');
    guardar();
  }
  $('dots').onclick = function (e) { var i = e.target.dataset.i; if (i != null) { idx = +i; player.ir(idx); } };

  // Reducir fotos antes de embeberlas: el paquete final tiene que pesar poco.
  function reducir(file, max, tipo) {
    return new Promise(function (ok, no) {
      var im = new Image(), u = URL.createObjectURL(file);
      im.onload = function () {
        var k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u); ok(c.toDataURL(tipo || 'image/jpeg', 0.8));
      };
      im.onerror = no; im.src = u;
    });
  }
  function opts(lista, sel) { return lista.map(function (o) { return '<option value="' + o.id + '"' + (o.id === sel ? ' selected' : '') + '>' + o.nombre + '</option>'; }).join(''); }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var VISTAS = [
    function () { // 1 rubro
      return '<h2>1. ¿Qué tipo de negocio sos?</h2><div class="grid">' + EP.RUBROS.map(function (r) {
        return '<button class="opt' + (cfg && cfg.rubro === r.id ? ' on' : '') + '" data-rubro="' + r.id + '"><span>' + r.icono + '</span>' + r.nombre + '</button>';
      }).join('') + '</div><p class="hint">Cargamos ejemplos para que solo edites los textos.</p>';
    },
    function () { // 2 estilo
      return '<h2>2. Elegí el estilo</h2><label>Colores</label><div class="sw">' + EP.PALETAS.map(function (p) {
        return '<button title="' + p.nombre + '" data-pal="' + p.id + '" class="' + (cfg.paleta === p.id ? 'on' : '') + '" style="background:linear-gradient(135deg,' + p.fondo + ' 34%,' + p.primario + ' 34% 67%,' + p.acento + ' 67%);border-color:' + (cfg.paleta === p.id ? 'var(--tx)' : 'var(--bd)') + '"></button>';
      }).join('') + '</div><label>Letra</label><select id="fuente">' + opts(EP.FUENTES, cfg.fuente) + '</select>' +
        '<label>Pantalla</label><select id="ori"><option value="h"' + (cfg.orientacion === 'h' ? ' selected' : '') + '>Horizontal (tele / monitor)</option><option value="v"' + (cfg.orientacion === 'v' ? ' selected' : '') + '>Vertical</option></select>' +
        '<label>Nombre del negocio</label><input id="nombre" value="' + esc(cfg.nombre) + '" placeholder="Ej: Clínica Del Sol">' +
        '<label>Texto del pie (teléfono, redes, dirección)</label><input id="pie" value="' + esc(cfg.pie) + '" placeholder="@minegocio · 223 000 0000">' +
        '<label>Logo (opcional)</label><input type="file" id="logo" accept="image/*">' +
        '<div class="nav"><button class="btn sec" id="azar">🎲 Sorprendeme</button></div>';
    },
    function () { // 3 contenido
      return '<h2>3. Tus avisos</h2>' + cfg.slides.map(function (s, i) {
        return '<div class="sl" data-i="' + i + '"><div class="top"><small>Aviso ' + (i + 1) + '</small><span>' +
          '<button class="mini" data-a="up">↑</button> <button class="mini" data-a="down">↓</button> <button class="mini" data-a="del">✕</button></span></div>' +
          '<label>Diseño</label><select data-k="layout">' + opts(EP.LAYOUTS, s.layout) + '</select>' +
          '<label>Título</label><input data-k="titulo" value="' + esc(s.titulo) + '">' +
          '<label>' + (s.layout === 'lista' ? 'Ítems (uno por línea: nombre|precio)' : 'Texto') + '</label><textarea data-k="texto">' + esc(s.texto) + '</textarea>' +
          (s.layout === 'lista' || s.layout === 'video' ? '' : '<div class="grid"><div><label>Precio / oferta</label><input data-k="precio" value="' + esc(s.precio) + '"></div><div><label>Etiqueta</label><input data-k="etiqueta" value="' + esc(s.etiqueta) + '" placeholder="Promo"></div></div>') +
          (s.layout === 'video' ? '<label>Video (.mp4, mejor si pesa menos de 50 MB)</label><input type="file" data-video accept="video/*">' + (s.videoNombre ? '<small>' + esc(s.videoNombre) + '</small>' : '') : '<label>Foto</label><input type="file" data-foto accept="image/*">') +
          '<label>Segundos en pantalla</label><input type="number" min="3" max="60" data-k="segundos" value="' + (s.segundos || 8) + '"></div>';
      }).join('') + '<button class="btn sec" id="add">+ Agregar aviso</button>';
    },
    function () { // 4 descargar
      var hayVideo = cfg.slides.some(function (s) { return s.layout === 'video' && s.video; });
      return '<h2>4. Descargá tu pantalla</h2><p>Revisá la vista previa. Te descargamos un <b>.zip</b> con todo adentro: el archivo <b>index.html</b>, tus fotos, videos y tipografías.</p>' +
        '<label>Nombre del negocio</label><input id="quien" value="' + esc(cfg.nombre) + '">' +
        '<div class="nav"><button class="btn" id="bajar">⬇ Descargar mi pantalla</button><button class="btn sec" id="play">▶ Pantalla completa</button></div>' +
        '<p class="hint" id="estado"></p>' +
        '<p class="hint">Descomprimí el zip y abrí <b>index.html</b> en el navegador de la tele o de una PC conectada; poné pantalla completa (F11). Funciona sin internet. Si querés que la publiquemos, escribinos y te guiamos.</p>' +
        (hayVideo ? '<p class="hint">Los videos tienen que estar en la misma carpeta que index.html (carpeta media).</p>' : '');
    }
  ];

  function nav() {
    return '<div class="nav"><button class="btn sec" id="atras"' + (paso === 0 ? ' disabled' : '') + '>Atrás</button>' +
      (paso < 3 ? '<button class="btn" id="sig">Siguiente</button>' : '') + '</div>';
  }
  function vista() {
    if (!cfg && paso > 0) paso = 0;
    $('panel').innerHTML = VISTAS[paso]() + nav();
    Array.prototype.forEach.call($('steps').children, function (b, i) { b.className = i <= paso ? 'on' : ''; });
    if (cfg) dibujar();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.rubro) { cfg = estadoDe(t.dataset.rubro); idx = 0; paso = 1; vista(); }
    else if (t.dataset.pal) { cfg.paleta = t.dataset.pal; vista(); }
    else if (t.id === 'sig' && cfg) { paso++; vista(); }
    else if (t.id === 'atras') { paso--; vista(); }
    else if (t.id === 'azar') { cfg.paleta = EP.PALETAS[Math.random() * EP.PALETAS.length | 0].id; cfg.fuente = EP.FUENTES[Math.random() * EP.FUENTES.length | 0].id; vista(); }
    else if (t.id === 'add') { cfg.slides.push({ layout: 'oferta', titulo: 'Nuevo aviso', texto: '', precio: '', etiqueta: '', img: '', video: '', segundos: 8 }); idx = cfg.slides.length - 1; vista(); }
    else if (t.dataset.a) {
      var i = +t.closest('.sl').dataset.i, a = t.dataset.a, s = cfg.slides;
      if (a === 'del') s.splice(i, 1);
      else { var j = a === 'up' ? i - 1 : i + 1; if (j >= 0 && j < s.length) { var x = s[i]; s[i] = s[j]; s[j] = x; } }
      vista();
    }
    else if (t.id === 'bajar') descargar(t);
    else if (t.id === 'play') { $('pv').requestFullscreen && $('pv').requestFullscreen(); }
  });

  document.addEventListener('input', function (e) {
    var t = e.target; if (!cfg) return;
    if (t.id === 'nombre' || t.id === 'pie') { cfg[t.id] = t.value; dibujar(); }
    else if (t.id === 'quien') { cfg.nombre = t.value; dibujar(); }
    else if (t.dataset.k) {
      var sl = t.closest('.sl'), i = +sl.dataset.i; idx = i;
      cfg.slides[i][t.dataset.k] = t.dataset.k === 'segundos' ? +t.value || 8 : t.value;
      if (t.dataset.k === 'layout') vista(); else dibujar();
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!cfg) return;
    if (t.id === 'fuente') { cfg.fuente = t.value; dibujar(); }
    else if (t.id === 'ori') { cfg.orientacion = t.value; dibujar(); }
    else if (t.id === 'logo' && t.files[0]) reducir(t.files[0], 300, 'image/png').then(function (d) { cfg.logo = d; dibujar(); });
    else if (t.dataset.video !== undefined && t.files[0]) {
      var j = +t.closest('.sl').dataset.i; idx = j;
      cfg.slides[j].video = URL.createObjectURL(t.files[0]); cfg.slides[j].videoNombre = t.files[0].name; vista();
    }
    else if (t.dataset.foto !== undefined && t.files[0]) {
      var i = +t.closest('.sl').dataset.i; idx = i;
      reducir(t.files[0], 1600).then(function (d) { cfg.slides[i].img = d; dibujar(); });
    }
  });

  function descargar(btn) {
    var nombre = (cfg.nombre || 'pantalla').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'pantalla';
    btn.disabled = true; $('estado').textContent = 'Armando el paquete...';
    EP.paquete(paraPlayer(), function (ruta) { return fetch(ruta).then(function (r) { if (!r.ok) throw new Error(ruta); return r.arrayBuffer(); }).then(function (b) { return new Uint8Array(b); }); })
      .then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'pantalla-' + nombre + '.zip'; a.click();
        $('estado').textContent = 'Listo: ' + (blob.size / 1048576).toFixed(1) + ' MB.';
      })
      .catch(function () { $('estado').textContent = 'No pudimos armar el paquete. Probá de nuevo.'; })
      .then(function () { btn.disabled = false; });
  }

  cfg = cargar();
  if (cfg && new URLSearchParams(location.search).get('rubro')) paso = 1;
  vista();
  if (!cfg) dibujar_vacio();
  function dibujar_vacio() { $('pv').innerHTML = '<div style="color:#fff;display:grid;place-items:center;height:100%;text-align:center;padding:20px">Elegí un rubro para ver la vista previa</div>'; }
})();
</script>
</body>
</html>
